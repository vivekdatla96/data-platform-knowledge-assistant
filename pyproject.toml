[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-platform-knowledge-assistant"
version = "0.1.0"
description = "RAG over synthetic ETL mappings, Snowflake-style metadata, lineage and runbooks, with verified citations and abstention."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "defusedxml>=0.7",
    "fastembed>=0.5,<0.8",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.34"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "boto3>=1.34"]

[project.scripts]
dpka = "dpka.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dpka = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: needs the real embedding model (downloads ~70 MB on first run)"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Unit tests (hashing embedder, Bedrock stubbed, no network)
        run: pytest

  model-eval:
    # Real open-source embedding model: downloads ~70 MB from Hugging Face on a cold cache.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.model-cache
          key: fastembed-bge-small-en-v1.5
      - run: pip install -e ".[dev]"
      - name: Real-model tests
        env:
          DPKA_RUN_MODEL_TESTS: "1"
          FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.model-cache
        run: pytest tests/test_model.py
      - name: Ingest, evaluate, demo
        env:
          FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.model-cache
        run: |
          dpka ingest --strict
          dpka eval --out eval-results/dev.json
          dpka eval --questions data/eval/holdout.jsonl --out eval-results/holdout.json
          python scripts/demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval-results/

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dpka:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name dpka -p 8000:8000 dpka:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 2; done
          curl -sf -X POST localhost:8000/api/ask -H 'Content-Type: application/json' \
            -d '{"question":"How do I backfill FACT_ORDERS for a past date range?"}' \
            | python -c "import json,sys; r=json.load(sys.stdin); print(r['status']); assert r['status']=='answered'"
          docker logs dpka
